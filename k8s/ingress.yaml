apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: book-manager-ingress
  namespace: book-manager
  labels:
    app: book-manager
  annotations:
    # For nginx-ingress controller
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "false"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"

    # For SSL/TLS with cert-manager (uncomment to enable)
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # cert-manager.io/acme-challenge-type: http01
spec:
  ingressClassName: nginx

  # Uncomment to enable SSL/TLS
  # tls:
  # - hosts:
  #   - www.yourdomain.com
  #   - api.yourdomain.com
  #   secretName: book-manager-tls

  rules:
  # Frontend
  - host: www.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 5173

  # Backend API
  - host: api.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8443

  # Alternative: Using paths instead of hosts (for single domain)
  # - host: yourdomain.com
  #   http:
  #     paths:
  #     - path: /
  #       pathType: Prefix
  #       backend:
  #         service:
  #           name: frontend-service
  #           port:
  #             number: 5173
  #     - path: /api
  #       pathType: Prefix
  #       backend:
  #         service:
  #           name: backend-service
  #           port:
  #             number: 8443
